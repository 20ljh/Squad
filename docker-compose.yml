# 로컬 개발용 서비스. 실행: docker compose up -d db
# 배포용 web·nginx·stt-worker는 배포 단계에서 추가합니다.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # 로컬 개발용 기본값 (.env.example 의 DATABASE_URL 과 같음). 배포에서는 .env 로 바꿈
      POSTGRES_USER: ${POSTGRES_USER:-squad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-squad}
      POSTGRES_DB: ${POSTGRES_DB:-squad}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-squad}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
